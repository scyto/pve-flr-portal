name: Image

# Builds the container image and publishes it to GitHub Container Registry
# as ghcr.io/<repository owner>/pve-flr-portal.
#
# - A version tag (the same push release.yml turns into a GitHub release)
#   publishes <version>, <major>.<minor> and latest for amd64 and arm64,
#   and only after the full test suite passes, like the release itself.
# - A pull request that changes the image builds it for amd64 without
#   pushing, to catch a broken Dockerfile before merge. CI runs the tests.
# - workflow_dispatch publishes one tag of your choosing from any branch,
#   for trying a build before a release.
on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.txt
      - .github/workflows/image.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish, e.g. 1.6.0-test.1
        required: true

permissions:
  contents: read
  packages: write

jobs:
  test:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install npm dependencies (CSS suite)
        run: npm install

      - name: Run the full test suite
        run: ./run-tests.sh

  image:
    needs: test
    # Runs after a passing test job, or on a PR, where test is skipped.
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      # Registry paths must be lowercase; an owner name may not be.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pve-flr-portal" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v4
        if: env.PUSH == 'true'

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=ref,event=pr

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PUSH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
